name: Actualización diaria del radar

on:
  schedule:
    - cron: "23 9 * * *"        # todos los días 09:23 UTC = 06:23 en Argentina
  workflow_dispatch:             # también se puede lanzar a mano desde la pestaña Actions
    inputs:
      days:
        description: "Ventana de búsqueda en días (la primera vez conviene 30)"
        default: "30"

permissions:
  contents: write

concurrency:
  group: radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 1. Recolectar fuentes
        run: python agent/collect.py --days ${{ inputs.days || '7' }}
      - name: 2. Filtrar lo relevante
        run: python agent/process.py filter --max 250
      - name: 3. Extraer tendencias con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python agent/process.py extract --limit 60
      - name: 4. Verificar contra el texto crudo
        run: python agent/process.py verify
      - name: 5. Exportar para el dashboard
        run: python agent/export.py
      - name: 6. Guardar resultados en el repositorio
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Actualización automática $(date -u +%F)"
          git push
